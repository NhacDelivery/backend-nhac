name: AI Issue Generator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número do PR para analisar (opcional no workflow_dispatch)"
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  analyze-and-create-issues:
    name: Analisar código e abrir issues
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
    steps:
      - name: Validar configuração de IA
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "Defina o secret OPENAI_API_KEY para usar este workflow."
            exit 1
          fi

      - name: Analisar PR e gerar issues
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isPR = context.eventName === "pull_request";
            const prNumberInput = core.getInput("pr_number");
            const prNumber = isPR
              ? context.payload.pull_request.number
              : (prNumberInput ? Number(prNumberInput) : NaN);

            if (!prNumber || Number.isNaN(prNumber)) {
              core.setFailed("Informe um PR válido (evento pull_request ou input pr_number no workflow_dispatch).");
              return;
            }

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const changedFiles = files
              .filter((file) => file.patch)
              .map((file) => `Arquivo: ${file.filename}\nPatch:\n${file.patch}`);

            if (changedFiles.length === 0) {
              core.info("Nenhuma alteração textual de código encontrada para análise.");
              return;
            }

            const diffText = changedFiles.join("\n\n---\n\n").slice(0, 120000);
            const prompt = `Você é um revisor técnico de código.
Analise o diff de um PR e retorne APENAS JSON válido no formato:
{"findings":[{"title":"string","body":"string","labels":["bug|security|performance|maintainability"],"confidence":"high|medium"}]}

Regras:
- Reporte apenas problemas concretos e acionáveis.
- Ignore estilo superficial.
- Se não houver problemas relevantes, retorne {"findings":[]}.
- Use português brasileiro.

PR: #${prNumber}
Título: ${pr.data.title}

DIFF:
${diffText}`;

            const response = await fetch("https://api.openai.com/v1/chat/completions", {
              method: "POST",
              headers: {
                "Authorization": `******
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model: process.env.OPENAI_MODEL || "gpt-4o-mini",
                temperature: 0.1,
                messages: [
                  { role: "system", content: "Você produz apenas JSON válido." },
                  { role: "user", content: prompt }
                ]
              })
            });

            if (!response.ok) {
              const errText = await response.text();
              core.setFailed(`Falha ao consultar IA: ${response.status} ${errText}`);
              return;
            }

            const completion = await response.json();
            const raw = completion?.choices?.[0]?.message?.content?.trim() || "";
            const cleaned = raw.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/\s*```$/, "");

            let parsed;
            try {
              parsed = JSON.parse(cleaned);
            } catch (error) {
              core.setFailed(`Resposta da IA não é JSON válido: ${cleaned.slice(0, 500)}`);
              return;
            }

            const findings = Array.isArray(parsed?.findings) ? parsed.findings : [];
            if (findings.length === 0) {
              core.info("IA não identificou problemas relevantes.");
              return;
            }

            const baseLabels = ["ai-generated", "ai-review"];
            for (const label of baseLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: "5319e7",
                    description: "Issue criada automaticamente por IA"
                  });
                } else {
                  throw error;
                }
              }
            }

            const existingOpen = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "ai-generated",
              per_page: 100
            });
            const existingTitles = new Set(existingOpen.map((issue) => issue.title));

            const maxIssues = 5;
            let createdCount = 0;

            for (const finding of findings.slice(0, maxIssues)) {
              const rawTitle = String(finding?.title || "").trim();
              const rawBody = String(finding?.body || "").trim();
              const extraLabels = Array.isArray(finding?.labels) ? finding.labels : [];
              const confidence = String(finding?.confidence || "medium").toLowerCase();

              if (!rawTitle || !rawBody) continue;

              const title = `[AI][PR #${prNumber}] ${rawTitle}`.slice(0, 250);
              if (existingTitles.has(title)) continue;

              const allowedLabels = ["bug", "security", "performance", "maintainability"];
              const normalizedExtraLabels = extraLabels
                .map((label) => String(label).toLowerCase().trim())
                .filter((label) => allowedLabels.includes(label));

              const issueBody = `## Detecção automática por IA

Este item foi identificado automaticamente durante a análise do PR #${prNumber}.

### Problema
${rawBody}

### Contexto
- PR: ${pr.data.html_url}
- Confiança da IA: ${confidence}

> Revise e confirme antes de implementar correções.
`;

              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: issueBody,
                labels: [...new Set([...baseLabels, ...normalizedExtraLabels])]
              });
              createdCount += 1;
              existingTitles.add(title);
            }

            core.info(`Issues criadas: ${createdCount}`);
