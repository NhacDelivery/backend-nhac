name: CI/CD

on:
  push:
    branches: [main, Edu, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "temurin"

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # 1) BUILD + TESTES + COBERTURA
  # ────────────────────────────────────────────────────────────
  test:
    name: 🧪 Build, testes e cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 🔍 Validar POM
        run: mvn -B validate

      - name: 🏗️ Compilar
        run: mvn -B -ntp clean compile

      - name: ✅ Rodar testes + gerar cobertura
        env:
          JWT_SENHA: ci_test_secret_key_not_for_production
        run: mvn -B -ntp verify

      - name: 📊 Publicar resultado dos testes
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "**/target/*-reports/TEST-*.xml"
          check_name: "Resultado dos testes"
          fail_on_failure: true
          require_tests: true

      - name: 📦 Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7
  # 2) SCAN DE DEPENDÊNCIAS
  # ────────────────────────────────────────────────────────────
  security-deps:
    name: 🔒 Scan de dependências
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Trivy — scan do filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: 📤 Upload resultado do Trivy (SARIF)
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: ${{ always() && hashFiles('trivy-fs-results.sarif') != '' }}
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-dependencies

  # ────────────────────────────────────────────────────────────
  # 3) BUILD & PUBLISH DOCKER
  # ────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Build & Publish Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-name: ${{ steps.image.outputs.name }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: Normalizar nome da imagem
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Metadata/tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=${{ github.run_number }}

      - name: 🔧 Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # 4) SCAN DA IMAGEM
  # ────────────────────────────────────────────────────────────
  security-image:
    name: 🔒 Scan da imagem Docker
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Login no GHCR para leitura da imagem
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Trivy — scan da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.docker.outputs.image-name }}@${{ needs.docker.outputs.image-digest }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: 📤 Upload resultado do Trivy (SARIF)
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: ${{ always() && hashFiles('trivy-image-results.sarif') != '' }}
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
  # ────────────────────────────────────────────────────────────
  # 5) NOTIFICAÇÃO
  # ────────────────────────────────────────────────────────────
  notify:
    name: 📣 Notificar resultado
    runs-on: ubuntu-latest
    needs: [test, security-deps, docker, security-image]
    if: always() && github.event_name == 'push'
    steps:
      - name: 📣 Discord
        if: ${{ vars.DISCORD_WEBHOOK_CONFIGURED == 'true' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.test.result == 'success' && 'success' || 'failure' }}
          title: "CI/CD — backend_nhac"
          description: |
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
            Autor: ${{ github.actor }}

            **Testes:** ${{ needs.test.result }}
          color: ${{ needs.test.result == 'success' && '0x57F287' || '0xED4245' }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"


