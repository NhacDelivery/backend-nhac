spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:senai2026}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==============================================================================
# Pool de conexões (HikariCP) — dimensionado para Aiven for MySQL
# ==============================================================================
# A Aiven calcula o max_connections DO SERVIÇO pelo RAM do plano (não é
# configurável, só sobe mudando de plano):
#     RAM <  4 GiB -> 75 x RAM + 1
#     RAM >= 4 GiB -> 100 x RAM + 1
#     1 GiB = 76 | 2 GiB = 151 | 4 GiB = 401 | 8 GiB = 801 | 16 GiB = 1601
#     32 GiB = 3201 | 64 GiB = 6401 | 128 GiB = 12801 | 192 GiB = 19201
# (planos pagos da Aiven para MySQL começam em 4 GiB; Free/Developer/Hobbyist
#  são 1 GiB = 76 conexões.)
#
# ATENÇÃO: além disso existe um limite POR USUÁRIO (max_user_connections) que a
# Aiven não expõe nem documenta — o backend usa um único usuário, então é ELE
# que vale, não o max_connections do serviço. A própria Aiven recomenda tratar o
# max_connections como "otimista" (~18 MB por conexão) e começar por uma fração
# dele, aumentando só depois de medir. Por isso os valores abaixo são modestos e
# ajustáveis por env var: DB_POOL_MAX / DB_POOL_MIN.
#
# Regra prática ao mexer:
#   - 1 instância do backend: o total aberto é o DB_POOL_MAX. Mantenha
#     instancias x DB_POOL_MAX bem abaixo do limite por usuário do seu plano.
#   - minimum-idle igual ao maximum-pool-size é a recomendação do HikariCP
#     (pool sempre quente, sem custo de abrir conexão na hora do pico). Se o
#     serviço tiver várias instâncias, prefira reduzir o MAX a deixar conexões
#     ociosas em cada uma.
spring.datasource.hikari.pool-name=NhacHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
# Falha rápido se o pool esgotar (default do Hikari é 30s).
# Conexão ociosa é reciclada depois de 5 min (com min=idle isso vale só para o
# excedente quando minimum-idle for menor que maximum-pool-size).
# Tempo de vida máximo de uma conexão. Precisa ser MENOR que o wait_timeout do
# MySQL (na Aiven o default é 28800s = 8h): 30 min gira a conexão antes de o
# servidor derrubá-la, e sobrevive a failover/manutenção da Aiven.
spring.datasource.hikari.max-lifetime=1800000
# Ping a cada 2 min nas conexões ociosas: detecta conexão morta antes de a
# requisição do usuário esbarrar nela.
spring.datasource.hikari.keepalive-time=120000
# Descomente para investigar conexão presa (loga stacktrace quando alguém
# segura uma conexão por mais de 60s):
#spring.datasource.hikari.leak-detection-threshold=60000
#
# TLS: a Aiven exige SSL nas conexões MySQL. O DB_URL precisa pedir isso, ex.:
#   jdbc:mariadb://<host>:<port>/<db>?sslMode=verify-full&serverSslCert=/etc/ssl/aiven-ca.pem
#   (o ca.pem da Aiven fica em Service > Overview > CA certificate)
# Para teste rápido sem validar o certificado: sslMode=trust
# ==============================================================================
