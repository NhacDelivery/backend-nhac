nhac.email.mock-mode=false
spring.flyway.validate-on-migrate=false

# Firebase Storage (upload de imagens de loja e produtos)
# Em mock-mode (padrão), o upload não sobe nada de verdade: só loga e devolve uma URL de placeholder.
# Para ligar de verdade: configure FIREBASE_STORAGE_BUCKET e FIREBASE_CREDENTIALS_BASE64
# (o JSON da service account em Base64) e defina NHAC_STORAGE_MOCK_MODE=false.
firebase.storage.bucket-name=${FIREBASE_STORAGE_BUCKET:nhac-backend.firebasestorage.app}
firebase.storage.credentials-path=classpath:nhac-backend-firebase-adminsdk-fbsvc-f1f23da265.json
firebase.storage.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}
nhac.storage.mock-mode=${NHAC_STORAGE_MOCK_MODE:false}
nhac.storage.max-tamanho-bytes=5242880
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Janela máxima para considerar GPS do entregador elegível ao despacho
nhac.entrega.localizacao-max-age-seconds=${ENTREGA_LOCALIZACAO_MAX_AGE_SECONDS:120}

# Isolamento explícito para locks/transições concorrentes previsíveis no MariaDB
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Caffeine: cache local por instancia, somente para consultas publicas de catalogo.
nhac.cache.enabled=${NHAC_CACHE_ENABLED:true}
nhac.cache.catalog-ttl=${NHAC_CACHE_CATALOG_TTL:30s}
nhac.cache.ratings-ttl=${NHAC_CACHE_RATINGS_TTL:2m}
nhac.cache.list-maximum-size=${NHAC_CACHE_LIST_MAXIMUM_SIZE:200}
nhac.cache.detail-maximum-size=${NHAC_CACHE_DETAIL_MAXIMUM_SIZE:2000}

# Código de entrega
nhac.entrega.codigo.max-tentativas=5
nhac.entrega.codigo.bloqueio-minutos=10

# Desempenho: batch fetch, limites e métricas sem exposição pública de dados.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100
spring.datasource.hikari.connection-timeout=30000
spring.task.scheduling.pool.size=3
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=2048
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,800ms,2s,5s

nhac.android.sha256-certificates=${NHAC_ANDROID_SHA256_CERTIFICATES:}
nhac.ios.team-id=${NHAC_IOS_TEAM_ID:}
