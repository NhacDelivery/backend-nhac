# ==========================================
# Configuração do Banco de Dados H2 (Memória)
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# Pool pequeno nos testes: o Spring reusa contextos e cada um teria o pool do
# application.properties (20 conexões, pool quente) apontando para o mesmo H2
# em memória — não agrega nada e só deixa a suíte mais lenta/barulhenta.
spring.datasource.hikari.pool-name=TestHikariPool
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Desativa o Flyway durante os testes para evitar conflitos com H2
spring.flyway.enabled=false

# ==========================================
# Segurança e Autenticação
# ==========================================
api.security.token.secret=minha_chave_secreta_local_muito_segura_12345_para_testes_apenas

# ==========================================
# Serviços Externos e Mocks
# ==========================================
# Twilio Mock
nhac.sms.mock-mode=true
logging.level.br.com.nhac.backend_nhac.domain.auth.TwilioSmsService=OFF

# Stripe Configuration (Mock)
stripe.api.key=sk_test_mock
stripe.webhook.secret=whsec_mock

# Asaas Configuration (Mock)
asaas.api.key=test_asaas_api_key
asaas.webhook.token=test_webhook_token
asaas.api.url=https://sandbox.asaas.com/api/v3

# Firebase Storage (Mock)
nhac.storage.mock-mode=true
nhac.storage.max-tamanho-bytes=5242880

# ==========================================
# Brevo (Envio de E-mail Real via ENV)
# ==========================================
# Pega a chave da variável de ambiente BREVO_API_KEY do seu sistema/IDE
brevo.api-key=${BREVO_API_KEY:}
brevo.api-base-url=${BREVO_BASE_URL:https://api.brevo.com/v3}
brevo.sender-email=${BREVO_SENDER_EMAIL:teu_email@gmail.com}
brevo.sender-name=${BREVO_SENDER_NAME:Nhac Delivery}
brevo.timeout-seconds=15

# Modo de e-mail mock desativado para permitir testes reais de integração de e-mail
nhac.email.mock-mode=false
